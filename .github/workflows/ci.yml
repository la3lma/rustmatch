name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install primary and MSRV toolchains
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt
          rustup toolchain install 1.85.0 --profile minimal
      - name: Install Java 21 for the compatibility oracle
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run repository quality gate
        run: cargo xtask ci

  performance-tripwire:
    name: Coarse performance tripwire
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out candidate revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Compare base and candidate on the same runner
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          C1_RUN_ROOT: ${{ runner.temp }}/rustmatch-c1
          RUSTMATCH_BENCH_RUNNER: github-actions-${{ runner.os }}-${{ runner.arch }}
        run: scripts/c1-tripwire.sh
      - name: Retain tripwire receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: c1-tripwire-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/rustmatch-c1/receipts/*.json
          if-no-files-found: warn
          retention-days: 30

  wuthering-tripwire:
    name: Wuthering performance tripwire
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out candidate revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Compare Wuthering base and candidate on the same runner
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          C2_RUN_ROOT: ${{ runner.temp }}/rustmatch-c2
          RUSTMATCH_BENCH_RUNNER: github-actions-${{ runner.os }}-${{ runner.arch }}
        run: scripts/c2-wuthering-tripwire.sh
      - name: Retain Wuthering tripwire receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: c2-wuthering-tripwire-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/rustmatch-c2/receipts/*.json
          if-no-files-found: warn
          retention-days: 30
