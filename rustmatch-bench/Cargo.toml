[package]
name = "rustmatch-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Unpublished correctness-gated benchmark adapter for rustmatch"
publish = false

[features]
experimental-showcase = ["rustmatch/unstable-assertion-prefix-v1"]

[dependencies]
regex = "=1.13.1"
rustmatch = { path = "../rustmatch", features = ["benchmark-internals"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[lints]
workspace = true
