[package]
name = "rustmatch-simd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Private architecture-specific kernels for rustmatch"
homepage = "https://github.com/la3lma/rustmatch"
documentation = "https://docs.rs/rustmatch-simd"
readme = "README.md"
keywords = ["regex", "matching", "simd", "avx2"]
categories = ["algorithms", "text-processing"]
publish = ["crates-io"]

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
